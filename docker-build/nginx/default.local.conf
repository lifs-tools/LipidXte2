upstream lipidxte {
    server lipidserver:8090;
}

server {
  server_name _;
#   server_name lipidxte.mpi-cbg.de;

  listen 443 ssl default_server;
  http2 on;

  ssl_certificate /etc/ssl/certs/nginx/lipidxte.pem;
  ssl_certificate_key /etc/ssl/certs/nginx/lipidxte.key;

  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers 'TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384';
  ssl_prefer_server_ciphers on;
  ssl_session_cache shared:SSL:50m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  location / {
    client_max_body_size 10M;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-NginX-Proxy true;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_pass http://lipidxte;
    proxy_set_header Host lipidxte.mpi-cbg.de;
    proxy_pass_request_headers on;
    proxy_ssl_session_reuse off;
    proxy_set_header Host $http_host;
    proxy_pass_header Server;
    proxy_cache_bypass $http_upgrade;
    proxy_redirect off;
    proxy_connect_timeout       300;
    proxy_send_timeout          300;
    proxy_read_timeout          300;
    send_timeout                300;
  }

#   location /api {
# 	  rewrite ^/api/(.*) /$1 break;
# 	  proxy_set_header X-Real-IP $remote_addr;
# 	  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
# 	  proxy_set_header X-NginX-Proxy true;
# 	  proxy_set_header Upgrade $http_upgrade;
# 	  proxy_set_header Connection 'upgrade';
# 	  proxy_pass http://api/;
# 	  proxy_ssl_session_reuse off;
# 	  proxy_set_header Host $http_host;
# 	  proxy_pass_header Server;
# 	  proxy_cache_bypass $http_upgrade;
# 	  proxy_redirect off;
#   }

  access_log off;
  error_log /var/log/nginx/error.log error;
}

server {
    listen 80 default_server;
    # listen [::]:80;
    server_name _;
    return 301 https://$host$request_uri;
}
