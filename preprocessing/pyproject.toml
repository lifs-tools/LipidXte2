[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lipidxte-preprocessing"
version = "0.1.0"
description = "Pre-processing scripts for the LipidXte2 shotgun-lipidomics pipeline (RAW->mzXML conversion, spectrum reorder, lipidXplorer batch run)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-2.0-only" }
authors = [
  { name = "Ronny Herzog" },
  { name = "Jacobo Miranda Ackermann" },
  { name = "HongKee Moon" },
]
keywords = ["lipidomics", "mass-spectrometry", "shotgun", "LipidXplorer"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: GNU General Public License v2 (GPLv2)",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "numpy",
  "ply",
  "numba",
  "lxml",
  "pandas",
  "fisher-py",
]

[project.optional-dependencies]
dev = [
  "pytest>=7",
  "pre-commit",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 79
include = '\.pyi?$'
exclude = '''
    /(
        \.git
      | \.hg
      | \.mypy_cache
      | \.tox
      | \.venv
      | _build
      | buck-out
      | build
      | dist
      | docs
      | intermediate
      | out
      | settings
      | venv
    )/
    '''

[tool.ruff]
select = ["E4", "E7", "E9", "F"]
ignore = ["E402", "F403", "F405"]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]
