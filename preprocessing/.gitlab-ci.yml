default:
  tags:
    - ubuntu-docker

cache:
  paths:
    - build/
    - venv/

stages:          # List of stages for jobs, and their order of execution
  - test

.template_job:
  image: python:3.12.3-slim
  before_script:
    - apt-get update -qy
    - apt-get -y install build-essential
    - apt-get -y install git mono-complete
    - pip install pytest-cov
    - python3 -V
    - pip install -r requirements.txt

test-job:   # This job runs in the test stage.
  extends: [ '.template_job' ]
  stage: test    # It only starts when the job in the build stage completes successfully.
  rules:
    - if: $CI_COMMIT_TAG
      when: never                                  # Do not run this job when a tag is created manually
    - if: $CI_COMMIT_BRANCH == 'main'  # Run this job when commits are pushed or merged to 'dev' branch
  script:
    - echo "Running unit tests..."
    - pytest --cov --cov-report term --cov-report xml:coverage.xml
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml


lint-job:
  stage: test
  image: python:3.7-slim-buster
  rules:
    - if: $CI_COMMIT_TAG
      when: never                                  # Do not run this job when a tag is created manually
    - if: $CI_COMMIT_BRANCH == 'main'  # Run this job when commits are pushed or merged to 'dev' branch
  before_script:
    - pip install pylint pylint-exit anybadge
  script:
    - mkdir pylint
    - pylint --exit-zero --output-format=text src/ | tee ./pylint/pylint.log || pylint-exit $?
    - PYLINT_SCORE=$(sed -n 's/^Your code has been rated at \([-0-9.]*\)\/.*/\1/p' ./pylint/pylint.log)
    - anybadge --label=$CI_JOB_NAME --file=pylint/pylint.svg --value=$PYLINT_SCORE 2=red 4=orange 8=yellow 10=green
    - echo "Pylint score is $PYLINT_SCORE"
  artifacts:
    paths:
      - pylint

pages:
  stage: test
  image: alpine:latest
  rules:
    - if: $CI_COMMIT_TAG
      when: never                                  # Do not run this job when a tag is created manually
    - if: $CI_COMMIT_BRANCH == 'main'  # Run this job when commits are pushed or merged to 'dev' branch
  script:
    - echo
  needs:
    - job: lint-job
      artifacts: true
  artifacts:
    paths:
      - pylint